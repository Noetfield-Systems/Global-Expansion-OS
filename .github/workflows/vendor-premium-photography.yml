name: Vendor Premium Photography Assets
on:
  push:
    paths: [.github/workflows/vendor-premium-photography.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.3.0
      - name: Download free-to-use Unsplash originals and encode optimized WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import urllib.request, io
          out=Path('public/media');out.mkdir(parents=True,exist_ok=True)
          photographs={
           'hero-city.webp':('photo-1519501025264-65ba15a82390',1700),
           'readiness.webp':('photo-1776417659908-c7c97e210e9f',1100),
           'launch-dubai.webp':('photo-1512453979798-5ea266f8880c',1100),
           'operations.webp':('photo-1521737711867-e3b97375f902',1100)
          }
          fallbacks={'readiness.webp':'photo-1487958449943-2429e8be8625'}
          for name,(photo,width) in photographs.items():
            attempts=[photo]+([fallbacks[name]] if name in fallbacks else [])
            for candidate in attempts:
              url=f'https://images.unsplash.com/{candidate}?auto=format&fit=crop&w={width}&q=85'
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'GlobalExpansionOS/5.0 (asset vendoring; docs in repository)'})
                with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read()
                image=ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert('RGB')
                assert image.width>=600 and image.height>=350, f'Unexpected dimensions for {name}: {image.size}'
                image.thumbnail((width,1200),Image.Resampling.LANCZOS)
                dest=out/name
                image.save(dest,format='WEBP',quality=84,method=6)
                print(f'{name}: {image.size}, {dest.stat().st_size} bytes, source={candidate}')
                break
              except Exception as exc:
                print(f'{name}: candidate {candidate} failed: {exc}')
            else:
              raise RuntimeError(f'No valid photograph source for {name}')
          PY
      - name: Commit only optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(v5): self-host optimized editorial photography"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
