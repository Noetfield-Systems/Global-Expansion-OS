name: Verify Global Expansion OS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
